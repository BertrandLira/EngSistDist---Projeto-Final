version: "3.8"

services:
  nextjs-web:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    container_name: nextjs_web
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs-app:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - INTERNAL_API_URL=http://nestjs-api:4000
    depends_on:
      - nestjs-api

  nestjs-api:
    build:
      context: ./nestjs-api
      dockerfile: Dockerfile
    container_name: nestjs_api
    ports:
      - "4000:4000"
    volumes:
      - ./nestjs-api:/app
      - /app/node_modules
      - video_data:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=4000
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=postgresql://user:pass@db:5432/db
      - REDIS_URL=redis://cache:6379
      - PYTHON_WORKER_URL=http://fastapi-worker:8000
    depends_on:
      - db
      - cache
      - fastapi-worker

  fastapi-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: python_ai_worker
    ports:
      - "8000:8000"
    volumes:
      - video_data:/app/media
    environment:
      - MEDIA_ROOT=/app/media
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - db

  db:
    image: ankane/pgvector:latest
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=db

  cache:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

volumes:
  video_data:
